# Lightsail 인스턴스 1대에 전부 올리는 운영 구성: Caddy(HTTPS·프론트) → 백엔드 → MySQL
#
#   cp deploy/.env.prod.example deploy/.env   # 값 채우기
#   docker compose -f deploy/compose.prod.yaml up -d --build
#
# - 밖으로 여는 포트는 80·443(Caddy) 뿐. 백엔드·MySQL 은 내부 네트워크에만 있다.
# - 워커가 행 잠금 없이 대기 건을 가져가므로 backend 는 1개만 띄운다(scale 금지).
# - 데이터는 named volume(mysql-data · uploads · caddy-data)에 남는다. 인스턴스 스냅샷으로 함께 백업된다.
name: origin-check

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-origin_check}
      MYSQL_USER: ${DB_USERNAME:-origin_check}
      MYSQL_PASSWORD: ${DB_PASSWORD:?deploy/.env 에 DB_PASSWORD 를 넣어 주세요}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?deploy/.env 에 DB_ROOT_PASSWORD 를 넣어 주세요}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 작은 인스턴스(2GB)용 메모리 설정
      - --innodb-buffer-pool-size=256M
      - --performance-schema=OFF
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build: ../backend
    image: origin-check-backend
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      STORAGE_DIR: /data/uploads
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m -XX:+ExitOnOutOfMemoryError}
    volumes:
      - uploads:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    image: origin-check-web
    environment:
      DOMAIN: ${DOMAIN:?deploy/.env 에 DOMAIN 을 넣어 주세요}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data      # 발급받은 인증서. 지우면 다시 발급받는다(발급 횟수 제한 주의)
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  uploads:
  caddy-data:
  caddy-config:
